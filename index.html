  <meta name="theme-color" content="#0a1612" />
  <title>CountQuest Blackjack</title>
  <script>
  (async function () {
    try {
      var b64 = (await (await fetch('_rebuild/index.html.gz.b64?v=1', { cache: 'no-store' })).text()).trim();
      var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
      var html = await new Response(stream).text();
      if (html.indexOf('<!DOCTYPE') === -1) throw new Error('bad html');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.body.textContent = 'Shell restore failed: ' + (e && e.message ? e.message : e);
    }
  })();
  </script>
</head>
