name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Web logic and structure tests
        run: python scripts/run_web_tests.py

      - name: Play Store v1 checks
        run: python scripts/test_play_store_v1.py

      - name: CountQuest package tests
        run: python -m unittest discover -s countquest/tests -v

      - name: Embedded browser runTests()
        env:
          CQ_BROWSER_TESTS: "1"
        run: python scripts/run_browser_tests.py

      - name: Version alignment
        run: python scripts/check_version_alignment.py

      - name: Table QA suite
        run: npm run test:table

      - name: Report table QA failure as PR comment
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🧪 Table QA failure report (run ${{ github.run_id }})"
            for f in table-qa-report.json stability-verify.out diag-hand2.out diag-dealer-mode.out; do
              if [ -f "artifacts/table-qa/$f" ]; then
                echo "### artifacts/table-qa/$f"
                echo '```'
                tail -c 6000 "artifacts/table-qa/$f"
                echo
                echo '```'
              fi
            done
          } > /tmp/qa-report.md
          gh pr comment "${
            github.event.pull_request.number
          }" --body-file /tmp/qa-report.md || echo "could not post comment"
